<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <style>
      .state-pending { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .state-processing { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .state-completed { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .state-failed { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      .state-cancelled { fill: #e5e7eb; stroke: #6b7280; stroke-width: 2; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2d3748; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #4a5568; }
      .arrow { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .error-arrow { stroke: #ef4444; stroke-width: 2; fill: none; marker-end: url(#error-arrowhead); }
      .cancel-arrow { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#cancel-arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4a5568"/>
    </marker>
    <marker id="error-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ef4444"/>
    </marker>
    <marker id="cancel-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Task State Transition Diagram</text>
  
  <!-- Initial state -->
  <circle cx="100" cy="100" r="10" fill="#2d3748"/>
  <path d="M 110 100 L 180 100" class="arrow"/>
  
  <!-- PENDING State -->
  <rect x="180" y="70" width="120" height="60" class="state-pending" rx="10"/>
  <text x="240" y="95" class="text" text-anchor="middle" font-weight="bold">PENDING</text>
  <text x="240" y="115" class="label" text-anchor="middle">대기 중</text>
  
  <!-- PROCESSING State -->
  <rect x="400" y="70" width="120" height="60" class="state-processing" rx="10"/>
  <text x="460" y="95" class="text" text-anchor="middle" font-weight="bold">PROCESSING</text>
  <text x="460" y="115" class="label" text-anchor="middle">처리 중</text>
  
  <!-- COMPLETED State -->
  <rect x="620" y="70" width="120" height="60" class="state-completed" rx="10"/>
  <text x="680" y="95" class="text" text-anchor="middle" font-weight="bold">COMPLETED</text>
  <text x="680" y="115" class="label" text-anchor="middle">완료</text>
  
  <!-- FAILED State -->
  <rect x="400" y="250" width="120" height="60" class="state-failed" rx="10"/>
  <text x="460" y="275" class="text" text-anchor="middle" font-weight="bold">FAILED</text>
  <text x="460" y="295" class="label" text-anchor="middle">실패</text>
  
  <!-- CANCELLED State -->
  <rect x="180" y="250" width="120" height="60" class="state-cancelled" rx="10"/>
  <text x="240" y="275" class="text" text-anchor="middle" font-weight="bold">CANCELLED</text>
  <text x="240" y="295" class="label" text-anchor="middle">취소됨</text>
  
  <!-- Transitions -->
  <!-- PENDING -> PROCESSING -->
  <path d="M 300 100 L 400 100" class="arrow"/>
  <text x="350" y="90" class="label" text-anchor="middle">worker picks up</text>
  
  <!-- PROCESSING -> COMPLETED -->
  <path d="M 520 100 L 620 100" class="arrow"/>
  <text x="570" y="90" class="label" text-anchor="middle">success</text>
  
  <!-- PROCESSING -> FAILED -->
  <path d="M 460 130 L 460 250" class="error-arrow"/>
  <text x="480" y="190" class="label">error</text>
  
  <!-- PENDING -> CANCELLED -->
  <path d="M 240 130 L 240 250" class="cancel-arrow"/>
  <text x="260" y="190" class="label">user cancel</text>
  
  <!-- PROCESSING -> CANCELLED -->
  <path d="M 400 130 L 300 250" class="cancel-arrow"/>
  <text x="320" y="180" class="label">user cancel</text>
  
  <!-- Progress Indicators -->
  <rect x="50" y="380" width="700" height="180" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="5"/>
  <text x="400" y="410" class="text" text-anchor="middle" font-weight="bold">Progress Tracking</text>
  
  <!-- Progress Bar -->
  <rect x="100" y="440" width="600" height="30" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" rx="5"/>
  <rect x="100" y="440" width="120" height="30" class="state-pending" rx="5"/>
  <rect x="220" y="440" width="180" height="30" class="state-processing" rx="5"/>
  <rect x="400" y="440" width="300" height="30" class="state-completed" rx="5"/>
  
  <text x="160" y="460" class="label" text-anchor="middle">0%</text>
  <text x="310" y="460" class="label" text-anchor="middle">20-80%</text>
  <text x="550" y="460" class="label" text-anchor="middle">100%</text>
  
  <!-- WebSocket Updates -->
  <text x="100" y="500" class="label">WebSocket Messages:</text>
  <text x="120" y="520" class="label">• "작업이 큐에 추가되었습니다"</text>
  <text x="320" y="520" class="label">• "파일 파싱 중... (20%)"</text>
  <text x="520" y="520" class="label">• "작업이 완료되었습니다"</text>
</svg>