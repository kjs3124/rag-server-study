<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <style>
      .client { fill: #e6f7ff; stroke: #1890ff; stroke-width: 2; }
      .server { fill: #f6ffed; stroke: #52c41a; stroke-width: 2; }
      .message { fill: #fff7ed; stroke: #ea580c; stroke-width: 1; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2d3748; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2d3748; }
      .code { font-family: 'Courier New', monospace; font-size: 12px; fill: #4a5568; }
      .arrow { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .ws-arrow { stroke: #00b5ad; stroke-width: 2; fill: none; stroke-dasharray: 3,3; marker-end: url(#ws-arrowhead); }
      .bidirectional { stroke: #9333ea; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4a5568"/>
    </marker>
    <marker id="ws-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#00b5ad"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="30" class="title" text-anchor="middle">WebSocket Real-time Communication Flow</text>
  
  <!-- Client Side -->
  <rect x="50" y="60" width="350" height="600" class="client" rx="5"/>
  <text x="225" y="85" class="text" text-anchor="middle" font-weight="bold">Client (Frontend)</text>
  
  <!-- Server Side -->
  <rect x="500" y="60" width="350" height="600" class="server" rx="5"/>
  <text x="675" y="85" class="text" text-anchor="middle" font-weight="bold">Server (WebSocket Manager)</text>
  
  <!-- 1. Connection -->
  <text x="70" y="120" class="text" font-weight="bold">1. WebSocket 연결</text>
  <rect x="70" y="130" width="310" height="60" class="message" rx="3"/>
  <text x="80" y="150" class="code">const ws = new WebSocket(</text>
  <text x="80" y="165" class="code">  'ws://localhost:8099/api/v1/ws/client-123'</text>
  <text x="80" y="180" class="code">);</text>
  
  <path d="M 380 160 L 500 160" class="ws-arrow"/>
  
  <rect x="520" y="140" width="310" height="40" class="message" rx="3"/>
  <text x="530" y="155" class="code">await websocket.accept()</text>
  <text x="530" y="170" class="code">active_connections[client_id] = websocket</text>
  
  <!-- 2. Subscribe -->
  <text x="70" y="220" class="text" font-weight="bold">2. 작업 구독</text>
  <rect x="70" y="230" width="310" height="60" class="message" rx="3"/>
  <text x="80" y="250" class="code">ws.send(JSON.stringify({</text>
  <text x="80" y="265" class="code">  type: 'subscribe',</text>
  <text x="80" y="280" class="code">  task_id: '550e8400-e29b-41d4'</text>
  
  <path d="M 380 260 L 500 260" class="arrow"/>
  
  <rect x="520" y="240" width="310" height="40" class="message" rx="3"/>
  <text x="530" y="255" class="code">subscriptions[client_id].append(task_id)</text>
  <text x="530" y="270" class="code">// 현재 상태 즉시 전송</text>
  
  <!-- 3. Progress Updates -->
  <text x="70" y="320" class="text" font-weight="bold">3. 진행상황 수신</text>
  
  <path d="M 500 340 L 380 340" class="ws-arrow"/>
  <rect x="70" y="330" width="310" height="75" class="message" rx="3"/>
  <text x="80" y="350" class="code">ws.onmessage = (event) => {</text>
  <text x="80" y="365" class="code">  const data = JSON.parse(event.data);</text>
  <text x="80" y="380" class="code">  // {type: 'task_update', progress: 20,</text>
  <text x="80" y="395" class="code">  //  message: '파일 파싱 중...'}</text>
  
  <rect x="520" y="330" width="310" height="60" class="message" rx="3"/>
  <text x="530" y="350" class="code">// Background Worker 호출:</text>
  <text x="530" y="365" class="code">await task_notifier.notify_progress(</text>
  <text x="530" y="380" class="code">  task_id, 20, '파일 파싱 중...')</text>
  
  <!-- 4. Multiple Updates -->
  <text x="450" y="430" class="text" text-anchor="middle">🔄 실시간 업데이트 반복</text>
  
  <path d="M 500 450 L 380 450" class="ws-arrow"/>
  <text x="80" y="465" class="code">{progress: 40, message: '청킹 중...'}</text>
  
  <path d="M 500 480 L 380 480" class="ws-arrow"/>
  <text x="80" y="495" class="code">{progress: 60, message: '벡터화 중...'}</text>
  
  <path d="M 500 510 L 380 510" class="ws-arrow"/>
  <text x="80" y="525" class="code">{progress: 80, message: '저장 중...'}</text>
  
  <!-- 5. Completion -->
  <text x="70" y="560" class="text" font-weight="bold">4. 작업 완료</text>
  <rect x="70" y="570" width="310" height="60" class="message" rx="3"/>
  <text x="80" y="590" class="code">{</text>
  <text x="80" y="605" class="code">  status: 'completed',</text>
  <text x="80" y="620" class="code">  result: {chunks_count: 42, ...}</text>
  
  <path d="M 500 600 L 380 600" class="ws-arrow"/>
  
  <rect x="520" y="580" width="310" height="40" class="message" rx="3"/>
  <text x="530" y="595" class="code">await task_notifier.notify_completed(</text>
  <text x="530" y="610" class="code">  task_id, result)</text>
  
  <!-- Connection Status -->
  <rect x="250" y="50" width="400" height="1" class="bidirectional"/>
  <text x="450" y="45" class="text" text-anchor="middle" font-size="12">WebSocket Connection (Persistent)</text>
</svg>